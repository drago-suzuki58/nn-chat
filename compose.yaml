services:
  app:
    build: .
    tty: true
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nn_chat
      TZ: "Asia/Tokyo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nn_chat"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ../nn-chat-db:/var/lib/postgresql/data

volumes:
  node_modules: